<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biuro</title>
<style>
/* kolory jak w aplikacji (src/index.css): ciemny domyślnie, jasny z klasą .light w aplikacji */
:root{
  --bg:#0f0f0f; --ink:#f5f5f5; --mute:#a6a6a6; --line:#2e2e2e;
  --card:rgba(26,26,26,.88); --card-solid:#1a1a1a; --chip:#2e2e2e;
  --ok:#22a559; --wait:#ff3434; --agent:#f59e0b; --off:#5c5c5c;
  --claude:#d97757; --clickup:#a78bfa; --bot:#3b82f6;
  --cu-bg:#2c2347; --cu-fg:#c4b5fd; --wt-bg:#4a1d1d; --wt-fg:#ff9c9c; --ag-bg:#43301a; --ag-fg:#fbbf6b;
}
:root.light{
  --bg:#ffffff; --ink:#1a1a1a; --mute:#666; --line:#d9d9d9;
  --card:rgba(255,255,255,.9); --card-solid:#fff; --chip:#f0f0f0; --off:#bdbdbd;
  --cu-bg:#efe9ff; --cu-fg:#6a4fe0; --wt-bg:#ffe5e5; --wt-fg:#d41f1f; --ag-bg:#fdf0dc; --ag-fg:#a5620c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;color:inherit}
.mono,.tag .t,.item .tm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;outline:none}

.sum{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px;font-weight:500;white-space:nowrap}
.chip .mono{font-size:12px}
.note{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--mute);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off);flex:none}
.dot.working{background:var(--ok)}
.dot.agents{background:var(--agent)}
.dot.waiting{background:var(--wait);animation:pulse 1.4s infinite}
.dot.bot{background:var(--bot)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,52,52,.5)}100%{box-shadow:0 0 0 8px rgba(255,52,52,0)}}

/* znaczki źródła pracy */
.ico{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
.ico.claude{color:var(--claude)} .ico.clickup{color:var(--clickup)} .ico.bot{color:var(--bot)}

/* etykiety nad głowami */
#tags{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--card-solid);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:13px;white-space:nowrap;transition:box-shadow .2s, opacity .3s}
.tag:hover,.tag.sel{box-shadow:0 0 0 2px var(--ink),0 6px 18px rgba(0,0,0,.2)}
.tag b{font-weight:600}
.tag .t{font-size:11.5px;color:var(--mute)}
.tag .ag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;padding:1px 6px 1px 4px;border-radius:999px;background:var(--ag-bg);color:var(--ag-fg)}
.tag .ag .ico{width:12px;height:12px;color:var(--claude)}
.tag .wt{font-size:11.5px;color:var(--wait);font-weight:600}
.tag.away{opacity:.6}

/* panel osoby */
#panel{position:absolute;top:12px;right:12px;bottom:12px;width:360px;max-width:calc(100% - 24px);background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);z-index:6;display:flex;flex-direction:column;transform:translateX(calc(100% + 40px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
.ph{padding:18px 18px 12px;display:flex;align-items:flex-start;gap:12px}
.ph h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.ph .st{display:flex;align-items:center;gap:7px;color:var(--mute);margin-top:6px;font-size:13px}
.close{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--chip);cursor:pointer;font-size:14px;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px 14px}
.stat{background:var(--chip);border-radius:12px;padding:10px 12px}
.stat .v{font-size:20px;font-weight:600}
.stat .l{font-size:12px;color:var(--mute)}
.pb{overflow:auto;padding:0 18px 18px;flex:1}
.pb h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 6px}
.item{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:20px 1fr auto;gap:2px 8px}
.item:first-of-type{border-top:0}
.item .ic{display:flex;align-items:center;height:20px}
.item .ti{font-weight:600}
.item .tm{font-size:12px;color:var(--mute);line-height:20px}
.item .sub{grid-column:2/4;color:var(--mute);font-size:12.5px}
.item .badges{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--mute)}
.bdg .ico{width:12px;height:12px}
.bdg.cu{background:var(--cu-bg);color:var(--cu-fg)}
.bdg.wait{background:var(--wt-bg);color:var(--wt-fg)}
.bdg.ag{background:var(--ag-bg);color:var(--ag-fg)}
.item.done .ti{color:var(--mute);font-weight:500}
.empty{color:var(--mute);font-size:13px;padding:6px 0}

#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);z-index:2;text-align:center;padding:16px}
.credit{position:absolute;left:14px;bottom:10px;font-size:11px;color:var(--mute);z-index:2}
.credit a{color:inherit}

@media (max-width:720px){
  .sum .chip:not(.keep){display:none}
  #panel{top:auto;right:8px;left:8px;bottom:8px;width:auto;max-width:none;height:62%;transform:translateY(calc(100% + 30px))}
  #panel.open{transform:none}
  .tag{font-size:12px;padding:4px 8px 4px 7px}
  .tag .t,.tag .ag,.tag .wt{display:none}
  .tag{font-size:11px;padding:3px 7px 3px 6px;gap:5px}
}
#tip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity .15s;display:flex;flex-direction:column;gap:2px;padding:7px 10px;border-radius:10px;background:var(--card-solid);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.22);font-size:12.5px;max-width:260px}
#tip span{color:var(--mute)}
.bubble{position:absolute;transform:translate(-50%,-100%);padding:4px 10px;border-radius:12px;background:#fff;color:#1b1b1b;font-weight:700;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .2s;pointer-events:none}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage"></div>
<div id="tags"></div>
<div id="tip"></div>
<div id="loading">Ładuję biuro…</div>
<div class="sum" id="sum"></div>
<aside id="panel" aria-live="polite"></aside>
<div class="credit">modele: <a href="https://kenney.nl" target="_blank" rel="noopener">Kenney</a> (CC0)</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// Strona osadzona w zakładce „Biuro” aplikacji (iframe z tej samej domeny): token logowania i motyw bierze z aplikacji.
// adres API tylko z tej samej domeny (albo localhost przy pracy lokalnej), żeby link z obcym ?api= nie wyciągnął tokenu
const API = (()=>{
  try {
    const u = new URL(new URLSearchParams(location.search).get('api') || location.origin, location.origin);
    return u.origin===location.origin || ['localhost','127.0.0.1'].includes(u.hostname) && ['localhost','127.0.0.1'].includes(location.hostname) ? u.origin : '';
  } catch { return ''; }
})();
const MIN = 60000;

// ================= dane =================
// osoby i sesje z /api/presence/state; ludzie siedzą przy biurkach, boty to szafy w pokoju narzędzi
const PEOPLE = {};   // id → {name, kind, model, recolor}
const STATE = { sessions:[], live:false, error:'' };

const fromServer = (s)=>({ ...s, human: s.human_recent,
  clickup_task: s.clickup_task ? (s.clickup_task.name || '#'+s.clickup_task.id) : null,
  counter: s.counter?.value ?? s.counter ?? null, counter_label: s.counter?.label || 'dziś' });

const fmt = (ms)=>{const m=Math.round(ms/MIN);return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`;};
const short = (ms)=>{const m=Math.round(ms/MIN);return m<60?`${m}m`:`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;};
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// znaczki: Claude (gwiazdka), ClickUp (szewron z łukiem), bot (zębatka)
const ICON = {
  claude: '<svg class="ico claude" viewBox="0 0 24 24" aria-label="Claude"><g stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></g></svg>',
  clickup: '<svg class="ico clickup" viewBox="0 0 24 24" aria-label="ClickUp"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10.5 12 4.5l7 6"/><path d="M4.5 15.5c4.6 5.3 10.4 5.3 15 0"/></g></svg>',
  bot: '<svg class="ico bot" viewBox="0 0 24 24" aria-label="bot"><rect x="5" y="8" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 4v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="9.5" cy="13.5" r="1.4" fill="currentColor"/><circle cx="14.5" cy="13.5" r="1.4" fill="currentColor"/></svg>',
};

function personState(id){
  const ss = STATE.sessions.filter(s=>s.owner===id);
  const open = ss.filter(s=>!s.ended_at);
  const claude = open.filter(s=>s.source==='claude');
  const agents = claude.filter(s=>s.status!=='idle').length + claude.reduce((a,s)=>a+s.subagents.length,0);
  const human = open.some(s=>s.human);
  const waiting = open.some(s=>s.status==='waiting');
  const working = open.some(s=>s.status==='working');
  let st, label;
  if (waiting) { st='waiting'; label='agent czeka na decyzję'; }
  else if (human && working) { st='working'; label='pracuje'; }
  else if (claude.some(s=>s.status==='working')) { st='agents'; label='pracują agenci'; }
  else if (human) { st='idle'; label='przy biurku'; }
  else { st='away'; label='poza biurem'; }
  const total = ss.reduce((a,s)=>a+s.active_ms,0);
  return { ss, open, claude, agents, human, waiting, typing: human && working, st, label, total };
}

// ================= scena =================
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
const TARGET = new THREE.Vector3(0,0.3,0);
cam.position.set(12,10.5,9.5).add(TARGET);
cam.lookAt(TARGET);

const hemi = new THREE.HemisphereLight(0xfff4ea, 0xb9a48f, 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0dd, 2.0);
sun.position.set(5,8,4);
sun.castShadow = true;
sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:30});
sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4;
scene.add(sun);

const mat = (c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.9,metalness:0,...o});
function block(w,h,d,color,x,y,z,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), typeof color==='number'?mat(color):color);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function cyl(r,h,color,x,y,z,parent=scene,seg=16){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg), typeof color==='number'?mat(color):color);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
// powtarzalny los, żeby cegły i deski wyglądały tak samo przy każdym wczytaniu
const R = (()=>{ let s=20261026; return ()=>(s=(s*16807)%2147483647)/2147483647; })();

// tekstury z canvasa: cegła, deski, beton
function canvasTex(w,h,draw){
  const c = document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
const BRICK = canvasTex(512,512,(g)=>{
  // 512 px = 1 jednostka; cegła 64×16 px, co drugi rząd przesunięty
  g.fillStyle='#b9a796'; g.fillRect(0,0,512,512);
  for (let r=0;r<32;r++){
    const off = r%2 ? 32 : 0;
    for (let x=-64;x<512;x+=64){
      g.fillStyle=`hsl(${9+R()*12},${34+R()*20}%,${30+R()*13}%)`;
      g.fillRect(x+off+1.5, r*16+1.5, 61, 13);
      g.fillStyle='rgba(255,255,255,.06)'; g.fillRect(x+off+1.5, r*16+1.5, 61, 3);
      g.fillStyle='rgba(0,0,0,.10)'; g.fillRect(x+off+1.5, r*16+11.5, 61, 3);
    }
  }
});
const PLANKS = canvasTex(512,512,(g)=>{
  // deski dębowe wzdłuż osi x, 8 pasów na jednostkę
  for (let r=0;r<8;r++){
    let x = -R()*300;
    while (x<512){
      const L = 180+R()*260;
      g.fillStyle=`hsl(${27+R()*7},${38+R()*14}%,${50+R()*10}%)`;
      g.fillRect(x, r*64, L, 64); if (x+L>512) g.fillRect(x-512, r*64, L, 64);
      for (let k=0;k<6;k++){ g.fillStyle=`rgba(90,55,25,${.05+R()*.06})`; g.fillRect(x, r*64+6+R()*52, L, 1.5); }
      g.fillStyle='rgba(60,35,15,.45)'; g.fillRect(x, r*64, 2, 64);
      x += L;
    }
    g.fillStyle='rgba(60,35,15,.5)'; g.fillRect(0, r*64, 512, 2);
  }
});
const CONCRETE = canvasTex(256,256,(g)=>{
  g.fillStyle='#b7b4ae'; g.fillRect(0,0,256,256);
  for (let i=0;i<2600;i++){ g.fillStyle=`rgba(${R()<.5?0:255},${R()<.5?0:255},${R()<.5?0:255},.035)`; g.fillRect(R()*256,R()*256,2+R()*5,2+R()*5); }
});
const texRep = (t,x,y)=>{ const c = t.clone(); c.needsUpdate = true; c.repeat.set(x,y); return c; };

// pokój: loft 8,4 × 6, ceglane ściany z tyłu i z lewej
const X0=-4.2, X1=4.2, Z0=-3.0, Z1=3.0, WH=1.75, WT=.14;
const IN_B = Z0+WT/2, IN_L = X0+WT/2;     // wewnętrzne lica ścian
const steel = mat(0x232323,{roughness:.55,metalness:.4});
block(X1-X0+WT, .16, Z1-Z0+WT, mat(0x3b3734), (X0+X1)/2-WT/2, -.08, (Z0+Z1)/2-WT/2);
const floor = block(X1-X0, .012, Z1-Z0, new THREE.MeshStandardMaterial({map:texRep(PLANKS,X1-X0,Z1-Z0),roughness:.7}), (X0+X1)/2, .006, (Z0+Z1)/2);
const brickBack = new THREE.MeshStandardMaterial({map:texRep(BRICK,X1-X0+WT,WH),roughness:.95});
const brickLeft = new THREE.MeshStandardMaterial({map:texRep(BRICK,Z1-Z0,WH),roughness:.95});
const wb = block(X1-X0+WT, WH, WT, brickBack, (X0+X1)/2-WT/2, WH/2, Z0);
const wl = block(WT, WH, Z1-Z0, brickLeft, X0, WH/2, (Z0+Z1)/2);
wb.castShadow = wl.castShadow = false;
block(X1-X0+WT+.02, .04, WT+.02, steel, (X0+X1)/2-WT/2, WH+.02, Z0);   // stalowe wykończenie góry ścian
block(WT+.02, .04, Z1-Z0, steel, X0, WH+.02, (Z0+Z1)/2);
block(X1-X0, .07, .015, mat(0x2a2a2a), (X0+X1)/2, .035, IN_B+.008);     // listwy
block(.015, .07, Z1-Z0, mat(0x2a2a2a), IN_L+.008, .035, (Z0+Z1)/2);

// rury pod sufitem, jak w starej fabryce
const pipe = mat(0x1f1f1f,{roughness:.4,metalness:.6});
{ const p1 = cyl(.022, X1-X0, pipe, (X0+X1)/2, 1.58, IN_B+.07); p1.rotation.z = Math.PI/2;
  const p2 = cyl(.022, Z1-Z0, pipe, IN_L+.07, 1.58, (Z0+Z1)/2); p2.rotation.x = Math.PI/2;
  cyl(.022, 1.58, pipe, IN_L+.07, .79, IN_B+.07);
  for (let x=X0+.6; x<X1; x+=1.2) block(.03,.05,.07, pipe, x, 1.58, IN_B+.035);
  for (let z=Z0+.6; z<Z1; z+=1.2) block(.07,.05,.03, pipe, IN_L+.035, 1.58, z); }

// duże okna w czarnych ramach na lewej ścianie, za nimi miasto
function skyTex(night){
  return canvasTex(256,256,(g)=>{
    const gr = g.createLinearGradient(0,0,0,256);
    gr.addColorStop(0, night?'#0b1022':'#9fd0ef'); gr.addColorStop(1, night?'#26304e':'#e7f3f8');
    g.fillStyle=gr; g.fillRect(0,0,256,256);
    let x=0;
    while (x<256){
      const w=18+R()*34, h=50+R()*120;
      g.fillStyle = night?'#141a2c':'#b9cad6'; g.fillRect(x,256-h,w,h);
      if (night) for (let yy=256-h+6; yy<250; yy+=9) for (let xx=x+4; xx<x+w-4; xx+=7) if (R()<.35){ g.fillStyle='#ffd27a'; g.fillRect(xx,yy,3,4); }
      x += w+2;
    }
  });
}
const SKY = { day: skyTex(false), night: skyTex(true) };
const skyMat = new THREE.MeshBasicMaterial({map:SKY.day});
const WINDOWS_Z = [-1.35, .1, 1.55];
for (const z of WINDOWS_Z){
  const W=1.12, H=1.12, y=.98, x=IN_L+.004;
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(W,H), skyMat);
  pane.rotation.y = Math.PI/2; pane.position.set(x,y,z); scene.add(pane);
  const f = (w,h,yy,zz)=>block(.03,h,w,steel,x+.012,yy,zz);
  f(W+.06,.05,y+H/2,z); f(W+.06,.05,y-H/2,z);
  for (const k of [-.5,-1/6,1/6,.5]) f(.035,H,y,z+k*W);
  for (const k of [-.25,.05,.3]) f(W,.025,y+k*H,z);
  block(.1,.035,W+.14, mat(0xd8d2c8), x+.05, y-H/2-.03, z);           // parapet
}

// neon important na tylnej ścianie nad open space
const LOGO_SVG = await fetch('assets/important-logo.svg').then(r=>r.text());
const NEON = [];
function neonMesh(drawFn, cw, ch, w, x, y, z, ry=0){
  const c = document.createElement('canvas'); c.width=cw; c.height=ch;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w*ch/cw), new THREE.MeshBasicMaterial({map:tex,transparent:true,toneMapped:false,depthWrite:false}));
  m.position.set(x,y,z); m.rotation.y = ry; scene.add(m);
  drawFn(c.getContext('2d'), c, ()=>tex.needsUpdate = true);
  NEON.push(m); return m;
}
const logoImg = await new Promise(res=>{ const i = new Image(); i.onload=()=>res(i);
  i.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO_SVG.replaceAll('#181818','#fff4ec')); });

  const pad=60, w=c.width-2*pad, h=w*60/388;

const loader = new GLTFLoader();
const cache = {};
const load = (p)=>cache[p] ??= loader.loadAsync(p);

const BASE = { wood:0xc99668, woodDark:0x9c6b45, plant:0x5fbf8a, metal:0x2b2b2b };
async function place(name,{x=0,z=0,y=0,ry=0,s=1,width=null,colors={},back=false}={}){
  const g = await load(`assets/furniture/${name}.glb`);
  const obj = g.scene.clone(true);
  const pal = {...BASE, ...colors};
  obj.traverse(o=>{ if(o.isMesh){ o.castShadow=o.receiveShadow=true; o.material = o.material.clone(); const c = pal[o.material.name]; if (c!==undefined) o.material.color.set(c); } });
  const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const k = width ? width/size.x : s;
  obj.position.set(-c.x, -box.min.y, -c.z);
  const inner = new THREE.Group(); inner.add(obj); inner.scale.setScalar(k);
  const wrap = new THREE.Group(); wrap.add(inner);
  wrap.userData.size = size.multiplyScalar(k);
  // back: dosunięte do tylnej ściany
  wrap.position.set(x, y, back ? IN_B + wrap.userData.size.z/2 + .005 : z); wrap.rotation.y = ry;
  scene.add(wrap);
  return wrap;
}

// kopia wspólnej tekstury Kenney dla jednej postaci: jaśniejsza skóra (odcienie pomarańczu), inny kolor koszulki (zielenie)
function recolored(gltf, {skin=0, shirt=null}){
  let src; gltf.scene.traverse(o=>{ if(o.isMesh && o.material.map) src = o.material.map; });
  const img = src.image, c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img,0,0);
  const d = g.getImageData(0,0,c.width,c.height), px = d.data, col = new THREE.Color(), hsl = {};
  for (let i=0;i<px.length;i+=4){
    col.setRGB(px[i]/255,px[i+1]/255,px[i+2]/255).getHSL(hsl);
    const deg = hsl.h*360;
    if (hsl.s>.25 && deg>=8 && deg<=35 && hsl.l>.3) col.setHSL(hsl.h+.01, hsl.s*.8, hsl.l+(1-hsl.l)*skin);
    else if (shirt!==null && hsl.s>.3 && deg>=120 && deg<=175) col.setHSL(shirt/360, hsl.s*.75, hsl.l*.95);
    else continue;
    px[i]=col.r*255; px[i+1]=col.g*255; px[i+2]=col.b*255;
  }
  g.putImageData(d,0,0);
  const t = new THREE.CanvasTexture(c);
  for (const k of ['flipY','colorSpace','magFilter','minFilter','wrapS','wrapT','generateMipmaps']) t[k] = src[k];
  return t;
}

const NODES = {
  A0:[-2.2,-2.3], A1:[-2.2,-1.25], A2:[-2.2,-.2], A3:[-2.2,.85], A4:[-2.2,1.75],
  B0:[-.67,-2.3], B1:[-.67,-1.25], B2:[-.67,-.2], B3:[-.67,.85], B4:[-.67,1.75],
  C2:[.95,-.2], C3:[.95,.85], C4:[.95,1.75],
  K0:[-2.47,-2.3], K1:[-3.1,-1.75],
  DN:[-3.3,-.55], DE:[-2.4,.5], DS:[-3.3,1.6], DW:[-3.9,-.2],
  F:[-1.4,2.5], F2:[.2,2.5],
  L0:[1.75,1.15], L1:[3.3,1.1], L2:[1.75,2.45], L3:[3.3,2.7], BED:[1.75,2.72], EXIT:[-3.85,2.55],
  G0:[1.78,-.2], G1:[1.78,-.85], G2:[1.78,-2.7],
};
const ADJ = {};
for (const e of `A0-A1 A1-A2 A2-A3 A3-A4 B0-B1 B1-B2 B2-B3 B3-B4 A4-B4 B4-C4 C2-C3 C3-C4 A0-K0 K0-K1 A1-K1 K1-DN K1-DW DN-DW
  A2-DN A2-DE A3-DE A3-DS A4-DS A4-F B4-F F-F2 B4-F2 C4-F2 C4-L0 L0-L1 L0-L2 L2-L3 L2-BED EXIT-DS EXIT-F C2-G0 G0-G1 G1-G2`.split(/\s+/)){
  const [a,b] = e.split('-'); (ADJ[a]??=[]).push(b); (ADJ[b]??=[]).push(a);
}
const ndist = (a,b)=>Math.hypot(NODES[a][0]-NODES[b][0], NODES[a][1]-NODES[b][1]);
function route(from, to){
  const d = {[from]:0}, prev = {}, todo = new Set(Object.keys(NODES));
  while (todo.size){
    let u=null; for (const n of todo) if (d[n]!==undefined && (u===null || d[n]<d[u])) u=n;
    if (u===null || u===to) break;
    todo.delete(u);
    for (const v of ADJ[u]||[]) { const nd = d[u]+ndist(u,v); if (d[v]===undefined || nd<d[v]) { d[v]=nd; prev[v]=u; } }
  }
  const out = [to]; while (out[0]!==from && prev[out[0]]) out.unshift(prev[out[0]]);
  return out;
}
const path = (from, to, last)=>{ const p = route(from,to).map(n=>({x:NODES[n][0], z:NODES[n][1]})); if (last) p.push({x:last.x, z:last.z}); return p; };

// gra na telewizorze: ping-pong, grają, gdy ktoś siedzi na sofie
const GAME = (()=>{
  const c = document.createElement('canvas'); c.width=256; c.height=144; const g = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const st = { bx:128, by:72, vx:150, vy:90, l:72, r:72, sl:0, sr:0, last:0 };
  function draw(play, dt){
    if (play){
      st.bx += st.vx*dt; st.by += st.vy*dt;
      if (st.by<8 || st.by>136) st.vy *= -1;
      st.l += (st.by-st.l)*Math.min(1,dt*5.5); st.r += (st.by-st.r)*Math.min(1,dt*4.8);
      if (st.bx<18){ if (Math.abs(st.by-st.l)<22) st.vx = Math.abs(st.vx); else { st.sr++; st.bx=128; } }
      if (st.bx>238){ if (Math.abs(st.by-st.r)<22) st.vx = -Math.abs(st.vx); else { st.sl++; st.bx=128; } }
    }
    g.fillStyle = play ? '#10131c' : '#0b0d12'; g.fillRect(0,0,256,144);
    if (!play){ g.fillStyle='#3a4a66'; g.font='600 16px Rubik, sans-serif'; g.textAlign='center'; g.fillText('important arcade', 128, 78); tex.needsUpdate = true; return; }
    g.fillStyle='#2a3350'; for (let y=4;y<144;y+=12) g.fillRect(126,y,4,6);

  const P = people[id] = { id, char, mixer, acts, cur:null, arms, mug, glow, ring, desk:D, head:new THREE.Vector3(),

function act(P, name){
  if (P.cur===name) return;
  const a = P.acts[name]; a.reset().setEffectiveWeight(1).fadeIn(.25).play();
  if (P.cur) P.acts[P.cur].fadeOut(.25);
  P.cur = name;
}
function pose(P, x, z, y, f){ P.char.position.set(x,y,z); P.char.rotation.y = f; P.face = f; }
function sitAtDesk(P){
  P.mode='desk'; P.at=P.desk.node; P.mug.visible=false;
  pose(P, P.desk.x-.31, P.desk.z, SY.desk, Math.PI/2); act(P,'sit');
}
function release(P){ if (P.seat) { P.seat.by=null; P.seat=null; } if (COFFEE.by===P.id) COFFEE.by=null; }
function walkTo(P, pts, done){ P.mode='walk'; P.path=pts; P.done=done; P.char.position.y=0; act(P,'walk'); }
function pickSeat(P){
  const free = SEATS.filter(s=>!s.by && !s.stand), stand = SEATS.filter(s=>!s.by && s.stand);
  const tv = free.filter(s=>s.tv), pool = tv.length && R()<.55 ? tv : free.length ? free : stand;
  const s = pool[Math.floor(R()*pool.length)] || SEATS[SEATS.length-1];
  s.by = P.id; P.seat = s; return s;
}
function sitBreak(P, s){
  P.mode='break'; P.at=s.node;
  pose(P, s.x, s.z, s.stand?0:s.y, s.f); act(P, s.stand?'idle':'sit');
  P.until = clock.elapsedTime + 70 + R()*140;   // po chwili dolewka albo coś z lodówki
}
function goCoffee(P){
  release(P);
  if (COFFEE.by){ walkTo(P, path(P.at,'K1'), ()=>{ P.mode='queue'; P.at='K1'; act(P,'idle'); }); return; }
  COFFEE.by = P.id;
  if (DOG.mode!=='lie' && R()<.6) dogGo('K1', 'beg');   // Lawa zawsze liczy na coś z kuchni
  walkTo(P, path(P.at,'K0'), ()=>{ P.at='K0'; P.mode='coffee'; P.face=Math.PI; act(P,'interact'); P.until = clock.elapsedTime+3.2; });
}

// decyzja, co postać ma teraz robić: siedzieć przy biurku, iść po kawę, siedzieć na przerwie
function think(P){
  const t = clock.elapsedTime;
  if (P.mode==='walk') return;
  if (P.want==='hidden'){
    // długo nieobecny wychodzi z biura drzwiami
    if (P.mode!=='hidden' && P.mode!=='coffee'){ release(P); P.mug.visible=false;
      walkTo(P, path(P.at,'EXIT',{x:X0+.05,z:NODES.EXIT[1]}), ()=>{ P.mode='hidden'; P.at='EXIT'; P.char.visible=false; }); }
    return;
  }
  if (P.mode==='hidden'){
    P.char.visible = true;
    if (t<4) sitAtDesk(P);   // przy otwarciu biura obecni już siedzą
    else { pose(P, X0+.05, NODES.EXIT[1], 0, Math.PI/2); P.at='EXIT';
      walkTo(P, path('EXIT', P.desk.node, {x:P.desk.x-.31, z:P.desk.z}), ()=>sitAtDesk(P)); }
    return;
  }
  if (P.mode==='coffee'){
    if (t<P.until) return;
    P.mug.visible = true; COFFEE.by = null;
    if (P.want==='desk') { walkTo(P, path('K0', P.desk.node, {x:P.desk.x-.31, z:P.desk.z}), ()=>sitAtDesk(P)); return; }
    const s = pickSeat(P);
    walkTo(P, path('K0', s.node, s), ()=>sitBreak(P,s));
    return;
  }
  if (P.want==='desk'){
    if (P.mode!=='desk'){ release(P); walkTo(P, path(P.at, P.desk.node, {x:P.desk.x-.31, z:P.desk.z}), ()=>sitAtDesk(P)); }
    return;
  }
  if (P.mode==='desk' || (P.mode==='break' && t>P.until) || (P.mode==='queue' && !COFFEE.by)) goCoffee(P);
}

function updatePerson(P, dt, t){
  think(P);
  P.mixer.update(dt);
  if (P.mode==='walk'){
    const tg = P.path[0], c = P.char.position;
    const dx = tg.x-c.x, dz = tg.z-c.z, d = Math.hypot(dx,dz), step = .5*dt;
    if (d<=step){ c.x=tg.x; c.z=tg.z; P.path.shift(); if (!P.path.length) P.done(); }
    else { c.x += dx/d*step; c.z += dz/d*step; P.face = Math.atan2(dx,dz); }
  }
  // płynny obrót w stronę ruchu
  let df = P.face - P.char.rotation.y; df = Math.atan2(Math.sin(df), Math.cos(df));
  P.char.rotation.y += df*Math.min(1, dt*10);

  const A = P.arms;
  if (P.mode==='desk'){
    // ręka w spoczynku jest rozłożona w bok: obrót wokół pionu kieruje ją do przodu, z opuszcza;
    // przy pisaniu dłonie na zmianę lekko stukają w klawiaturę
    const fw = P.typing ? 1.25 : .7, down = P.typing ? .3 : .95;
    const tapL = P.typing ? Math.max(0, Math.sin(t*13+P.phase))*.14 : 0;
    const tapR = P.typing ? Math.max(0, Math.sin(t*13+P.phase+2.4))*.14 : 0;
    A.l.rotation.set(0, -fw, -down + tapL);
    A.r.rotation.set(0,  fw,  down - tapR);
    if (A.head) A.head.rotation.x = (P.typing ? .12 : 0) + Math.sin(t*1.1+P.phase)*.025;
  } else if (P.mode==='break' && P.cur==='sit'){
    // na przerwie: lewa ręka luźno, prawa trzyma kubek i co kilka sekund pije
    const sipping = ((t+P.sip)%7) < 1.4;
    A.l.rotation.set(0, -.6, -1.05);
    A.r.rotation.set(0, sipping ? 1.5 : 1.15, sipping ? -.35 : .55);
    if (A.head) A.head.rotation.x = sipping ? -.12 : Math.sin(t*.7+P.phase)*.05;
  } else if (P.mug.visible && P.mode!=='coffee'){
    A.r.rotation.set(0, 1.15, .55);   // kubek przed sobą przy chodzeniu i staniu
  }
}

const DOG_SPOTS = ['A4','B4','F','F2','L0','L2','K1','DE','G1','G2','C3','BED','DS','A2','B0'];
function dogGo(node, after){
  DOG.path = path(DOG.at, node); DOG.target = node; DOG.mode = 'walk'; DOG.after = after || null;
  DOG.speed = R()<.25 ? 1.5 : .7;   // czasem dostaje głupawki i biegnie
}
function updateDog(dt, t){
  const D = DOG, p = D.g.position;
  if (D.mode==='walk'){
    const tg = D.path[0], dx = tg.x-p.x, dz = tg.z-p.z, d = Math.hypot(dx,dz), step = D.speed*dt;
    if (d<=step){ p.x=tg.x; p.z=tg.z; D.path.shift();
      if (!D.path.length){ D.at = D.target;
        if (D.target==='BED'){ D.mode='lie'; D.until = t+14+R()*20; D.face = -2.4; }
        else if (D.after==='beg'){ D.mode='sit'; D.until = t+7; D.face = Math.PI*.8; }
        else { D.mode='sniff'; D.until = t+1.5+R()*4; } } }
    else { p.x += dx/d*step; p.z += dz/d*step; D.face = Math.atan2(dx,dz); }
  } else if (t>D.until){
    dogGo(R()<.18 ? 'BED' : DOG_SPOTS[Math.floor(R()*DOG_SPOTS.length)]);
  }
  let df = D.face - D.g.rotation.y; df = Math.atan2(Math.sin(df), Math.cos(df)); D.g.rotation.y += df*Math.min(1, dt*8);
  const moving = D.mode==='walk', fast = D.speed>1;
  const k = t*(fast?16:10);
  D.legs.forEach((l,i)=>{
    const target = D.mode==='lie' ? (i<2 ? -1.45 : 1.45) : D.mode==='sit' ? (i<2 ? 0 : -1.2) : moving ? Math.sin(k+(i===0||i===3?0:Math.PI))*(fast?.75:.5) : 0;
    l.rotation.x += (target-l.rotation.x)*Math.min(1,dt*12);
  });
  const by = D.mode==='lie' ? -.13 : D.mode==='sit' ? -.04 : moving ? Math.abs(Math.sin(k))*.015 : 0;
  D.body.position.y += (by-D.body.position.y)*Math.min(1,dt*8);
  D.body.rotation.x += ((D.mode==='sit' ? -.45 : 0)-D.body.rotation.x)*Math.min(1,dt*8);
  D.head.rotation.x = D.mode==='lie' ? .25 : D.mode==='sniff' ? .35+Math.sin(t*9)*.08 : D.mode==='sit' ? .3 : Math.sin(k*2)*.03;
  D.head.rotation.y = D.mode==='sit' ? Math.sin(t*1.5)*.25 : 0;
  D.tail.rotation.y = Math.sin(t*(D.mode==='lie'?2:D.mode==='sit'?14:9))*(D.mode==='lie'?.15:.6);
  D.tongue.visible = fast && moving || D.mode==='sit';
  // podskok po kliknięciu
  if (D.jump>0){ D.jump -= dt; p.y = Math.max(0, Math.sin((1-D.jump/.5)*Math.PI))*.18; } else p.y = 0;
}

function syncPeople(list){

      if (PEOPLE[p.id]) continue;
      PEOPLE[p.id] = p;
      if (p.kind!=='bot'){ const n = Object.keys(people).length; if (n<DESKS.length) await buildDesk(p.id, n); }
    }
  });
  return building;
}

// ================= etykiety i panel =================
// nad głowami tylko imię i kropka; reszta w dymku po najechaniu i w panelu po kliknięciu
const tagsEl = document.getElementById('tags');
const tags = {};
function makeTag(id){
  const b = document.createElement('button'); b.className='tag';
  b.onclick = (e)=>{ e.stopPropagation(); select(id); };
  tagsEl.appendChild(b); tags[id]=b; return b;
}

function renderTags(){
  for (const id in people){
    const s = personState(id), t = tags[id] || makeTag(id);
    t.className = 'tag' + (s.st==='away'?' away':'') + (SEL===id?' sel':'');
    t.innerHTML = `<i class="dot ${s.st}"></i><b>${esc(PEOPLE[id].name)}</b>`
      + (s.total>=MIN ? `<span class="t">${short(s.total)}</span>` : '')
      + (s.agents ? `<span class="ag" title="wątki Claude">${ICON.claude}${s.agents}</span>` : '')
      + (s.waiting ? `<span class="wt">czeka</span>` : '');
  }
}

function itemHTML(s){
  const badges = [];
  if (s.status==='waiting') badges.push('<span class="bdg wait">czeka na decyzję</span>');
  if (s.subagents.length) badges.push(`<span class="bdg ag">${ICON.claude}${s.subagents.length} ${s.subagents.length===1?'agent':'agentów'}: ${esc(s.subagents.join(', '))}</span>`);
  if (s.clickup_task && s.source!=='clickup') badges.push(`<span class="bdg cu">${ICON.clickup}${esc(s.clickup_task)}</span>`);
  else if (s.source==='claude') badges.push('<span class="bdg">bez zadania w ClickUp</span>');
  const sub = [s.project, s.ended_at ? 'skończone' : s.activity].filter(Boolean).map(esc).join(' · ');
  return `<div class="item ${s.ended_at?'done':''}"><span class="ic">${ICON[s.source]||''}</span><span class="ti">${esc(s.title||s.project)}</span><span class="tm">${fmt(s.active_ms)}</span>${sub?`<span class="sub">${sub}</span>`:''}${s.summary?`<span class="sub">${esc(s.summary)}</span>`:''}${badges.length?`<div class="badges">${badges.join('')}</div>`:''}</div>`;
}

const panel = document.getElementById('panel');
let SEL = null;
function renderPanel(){
  if (!SEL || !PEOPLE[SEL]) { panel.classList.remove('open'); return; }
  panel.classList.add('open');
  const offline = STATE.live ? '' : '<span class="note">brak połączenia</span>';
  if (PEOPLE[SEL].kind==='bot'){
    const ss = STATE.sessions.filter(x=>x.owner===SEL), b = ss.find(x=>!x.ended_at);
    const total = ss.reduce((a,s)=>a+s.active_ms,0);
    panel.innerHTML = `<div class="ph"><div><h2>${esc(PEOPLE[SEL].name)}</h2><div class="st"><i class="dot ${b?'bot':''}"></i>${b ? esc(b.activity||'działa') : 'nie działa'} ${offline}</div></div><button class="close" aria-label="Zamknij">✕</button></div>
      <div class="stats"><div class="stat"><div class="v">${esc(b?.counter ?? 0)}</div><div class="l">${esc(b?.counter_label || 'dziś')}</div></div><div class="stat"><div class="v">${fmt(total)}</div><div class="l">działa dziś</div></div></div>
      <div class="pb"><h3>Teraz</h3>${b ? itemHTML(b) : '<div class="empty">Nic nie robi.</div>'}</div>`;
  } else {
    const s = personState(SEL);
    const now = s.open.sort((a,b)=>(a.status==='waiting'?-1:0)-(b.status==='waiting'?-1:0));
    // sesje krótsze niż minuta (otwarte i zamknięte bez pracy) nie zaśmiecają historii ani listy do zalogowania
    const done = s.ss.filter(x=>x.ended_at && (x.title || x.active_ms>=MIN));
    const tolog = s.ss.filter(x=>x.ended_at && x.source==='claude' && !x.clickup_task && x.active_ms>=MIN);
    panel.innerHTML = `<div class="ph"><div><h2>${esc(PEOPLE[SEL].name)}</h2><div class="st"><i class="dot ${s.st}"></i>${s.label} ${offline}</div></div><button class="close" aria-label="Zamknij">✕</button></div>
      <div class="stats"><div class="stat"><div class="v">${fmt(s.total)}</div><div class="l">pracy dziś</div></div><div class="stat"><div class="v">${s.agents}</div><div class="l">${s.agents===1?'agent pracuje':'agentów pracuje'}</div></div></div>
      <div class="pb">
        <h3>Teraz</h3>${now.length ? now.map(itemHTML).join('') : '<div class="empty">Nic otwartego.</div>'}
        ${done.length ? `<h3>Wcześniej dziś</h3>${done.map(itemHTML).join('')}` : ''}
        ${tolog.length ? `<h3>Do zalogowania w ClickUp</h3>${tolog.map(x=>`<div class="item"><span class="ic">${ICON.claude}</span><span class="ti">${esc(x.title||x.project)}</span><span class="tm">${fmt(x.active_ms)}</span>${x.title?`<span class="sub">${esc(x.project)}</span>`:''}</div>`).join('')}` : ''}
      </div>`;
  }
  panel.querySelector('.close').onclick = ()=>select(null);
}

function select(id){
  SEL = (id && id===SEL) ? null : id;
  history.replaceState(null,'',SEL?'#'+SEL:location.pathname+location.search);
  render();
}
addEventListener('keydown',e=>{ if(e.key==='Escape') select(null); });

function renderSummary(){
  const all = Object.keys(people).map(personState);
  const working = all.filter(s=>s.st==='working'||s.st==='waiting').length;
  const pause = all.filter(s=>s.st==='idle'||s.st==='agents').length;
  const agents = all.reduce((a,s)=>a+s.agents,0);
  document.getElementById('sum').innerHTML =
    `<span class="chip keep"><i class="dot working"></i>${working} przy pracy</span>`
    + (pause ? `<span class="chip">☕ ${pause} na przerwie</span>` : '')
    + `<span class="chip">${ICON.claude}${agents} ${agents===1?'agent':'agentów'}</span>`
    + (BOTS.total ? `<span class="chip keep"><i class="dot ${BOTS.alert?'waiting':'working'}"></i>automaty ${BOTS.ok}/${BOTS.total}${BOTS.alert?` · ${BOTS.alert} ${BOTS.alert===1?'błąd':'błędy'}`:''}</span>` : '')
    + (STATE.error ? `<span class="chip keep">${esc(STATE.error)}</span>` : '')
    + `<span class="chip mono" id="clock"></span>`;
  tick();
}
const tick = ()=>{ const c=document.getElementById('clock'); if(c) c.textContent = new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}); };
setInterval(tick, 10000);

// ================= motyw panelu jak w aplikacji, pora dnia w biurze z zegara =================
const appRoot = (()=>{ try { return parent.document.documentElement; } catch { return null; } })();
const isDark = ()=> appRoot ? !appRoot.classList.contains('light') : (localStorage.getItem('ui-theme') || 'dark') === 'dark';
const applyTheme = ()=> document.documentElement.classList.toggle('light', !isDark());
const forced = new URLSearchParams(location.search).get('pora');   // ?pora=noc do podglądu
const isNight = ()=>{ if (forced) return forced==='noc'; const h = new Date().getHours(); return h < 7 || h >= 19; };
let NIGHT = isNight();
function applyNight(){
  hemi.intensity = NIGHT ? .55 : 1.5;
  hemi.color.set(NIGHT ? 0x9a9ab8 : 0xfff4ea); hemi.groundColor.set(NIGHT ? 0x2a2622 : 0xb9a48f);
  sun.intensity = NIGHT ? .35 : 2.0; sun.color.set(NIGHT ? 0x8fa0ff : 0xfff0dd);
  skyMat.map = NIGHT ? SKY.night : SKY.day; skyMat.needsUpdate = true;
  for (const L of LAMPS) L.l.intensity = NIGHT ? L.night : (L.neon ? .3 : 0);
  neonLight.intensity = NIGHT ? 2.2 : .4;
}
applyTheme();
if (appRoot) new MutationObserver(applyTheme).observe(appRoot,{attributes:true,attributeFilter:['class']});
setInterval(()=>{ if (isNight()!==NIGHT){ NIGHT=isNight(); applyNight(); } }, 60000);

// ================= stan → scena =================
function applyState(){
  for (const id in people){
    const s = personState(id), P = people[id];
    // przy biurku, póki pisał w ostatnich 10 min (też gdy czyta odpowiedź); przerwa, gdy pracują za niego tylko agenci
    P.want = s.st==='away' ? 'hidden' : s.st==='agents' ? 'break' : 'desk';
    P.typing = s.typing;
    P.glowOn = s.st!=='away' && s.st!=='idle';
    P.ring.material.opacity = SEL===id ? .22 : 0;
  }
  // automaty: każdy bot ma swoje stanowisko; agenci: jeden robot na otwartą sesję Claude
  const auto = [], ag = [];
  for (const id in PEOPLE) if (PEOPLE[id].kind==='bot'){
    const s = STATE.sessions.filter(x=>x.owner===id && !x.ended_at).sort((a,b)=>b.started_at-a.started_at)[0];
    const health = !s ? 'off' : s.status==='waiting' ? 'alert' : s.status==='working' ? 'ok' : 'idle';
    auto.push({ id, kind:'bot', name:PEOPLE[id].name, short:PEOPLE[id].name, health, counter: s && s.counter!=null ? { value:s.counter, label:s.counter_label || 'dziś' } : null,
      info: !s ? 'nie działa' : (s.activity || s.title || 'działa'), working: health==='ok', waiting: health==='alert' });
  }
  for (const s of STATE.sessions) if (s.source==='claude' && !s.ended_at && s.status!=='idle' && PEOPLE[s.owner])
    ag.push({ id:s.owner, kind:'claude', name:`Agent: ${PEOPLE[s.owner].name}`, short:s.title || s.project || PEOPLE[s.owner].name,
      health: s.status==='waiting' ? 'wait' : 'agent', info: s.title || s.project, working: s.status==='working', waiting: s.status==='waiting' });
  BOTS.total = auto.length; BOTS.ok = auto.filter(o=>o.health==='ok'||o.health==='idle').length; BOTS.alert = auto.filter(o=>o.health==='alert').length;
  // gdy botów więcej niż miejsc, wyłączone zostają poza salą
  const ORDER = { alert:0, ok:1, idle:2, off:3 };
  auto.sort((a,b)=>ORDER[a.health]-ORDER[b.health]);
  const free = { ag:[...ag], auto:[...auto] };
  STATIONS.forEach(S=>{
    if (!S.robot) return;
    const o = free[S.zone].shift() || null; S.occ = o;
    S.robot.visible = !!o;
    if (o){ const st = ROBOT_STYLE[o.kind]; S.bodyM.color.set(st.body); S.trimM.color.set(st.trim); S.eyeM.color.set(o.working||o.waiting ? st.eye : 0x3a3f48); }
    S.scr.material = o && (o.working || o.waiting) ? screenOn : screenOff;
    S.ring.material.opacity = o && SEL===o.id && o.kind==='bot' ? .22 : 0;
    const key = o ? JSON.stringify([o.short,o.health,o.counter,o.info]) : '';
    if (key!==S.key){ S.key = key; drawBoard(S, o); }
  });
}
const BOTS = { total:0, ok:0, alert:0 };

function render(){ applyState(); renderTags(); renderPanel(); renderSummary(); resize(); }

// ================= pętla =================
const clock = new THREE.Clock();
const UP = new THREE.Vector3(0,.42,0);
const v = new THREE.Vector3();
const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = 'Hau!'; tagsEl.appendChild(bubble);
function frame(){
  const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime;
  for (const id in people){
    const P = people[id];
    updatePerson(P, dt, t);
    const target = P.glowOn && P.mode==='desk' ? (NIGHT ? .03 : .015) : 0;
    P.glow.intensity += (target-P.glow.intensity)*.1;
  }
  // roboty: przy pracy stukają i mrugają, bez pracy drzemią z opuszczoną głową
  SCREEN_TEX.offset.y = (t*.08)%1;
  for (const S of STATIONS){
    if (!S.robot || !S.occ) continue;
    const on = S.occ.working, w = S.occ.waiting;
    S.armL.rotation.x = on ? -1.15 + Math.max(0,Math.sin(t*12+S.phase))*.18 : -.25;
    S.armR.rotation.x = on ? -1.15 + Math.max(0,Math.sin(t*12+S.phase+2))*.18 : -.25;
    S.head.rotation.x = on ? Math.sin(t*2+S.phase)*.04 : w ? -.1 : .32;
    S.head.rotation.y = w ? Math.sin(t*2.4)*.35 : 0;
    const blink = (t+S.phase)%4 < .12;
    S.eyes.forEach(e=>e.scale.y = blink && on ? .15 : 1);
    S.led.material.color.set(w ? (Math.sin(t*6)>0 ? 0xff3434 : 0x5a1010) : on ? (Math.sin(t*3+S.phase)>0 ? 0x3ddc97 : 0x1d6b4c) : 0x59606f);
  }
  const playing = SEATS.some(x=>x.tv && x.by && people[x.by]?.mode==='break');
  GAME.draw(playing, dt);
  RACK_LEDS.forEach((l,i)=>l.material.color.set(Math.sin(t*(2+i%4)+i*1.7)>.1 ? 0x3ddc97 : 0x1d6b4c));
  updateDog(dt, t);
  renderer.render(scene, cam);

  // etykiety nad głowami
  const W = stage.clientWidth, H = stage.clientHeight;
  const placed = [];
  for (const id in tags){
    const P = people[id]; if (!P) continue;
    tags[id].style.display = P.char.visible ? '' : 'none';
    if (!P.char.visible) continue;
    v.copy(P.arms.head.getWorldPosition(P.head).add(UP)).project(cam);
    const w = tags[id].offsetWidth, th = tags[id].offsetHeight, half = w/2 + 8, right = SEL && W>720 ? W-380 : W;
    const x = Math.min(Math.max((v.x+1)/2*W, half), right-half);
    let y = (1-v.y)/2*H;
    for (let hit = true; hit; ){
      hit = placed.find(r=>Math.abs(r.x-x) < (r.w+w)/2+4 && Math.abs(r.y-y) < th+3);
      if (hit) y = hit.y - th - 4;
    }
    placed.push({x, y, w});
    tags[id].style.left = x+'px';
    tags[id].style.top = y+'px';
  }
  bubble.style.opacity = DOG.bark>t ? 1 : 0;
  if (DOG.bark>t){ v.copy(DOG.g.position).add(tmpV.set(0,.5,0)).project(cam); bubble.style.left = (v.x+1)/2*W+'px'; bubble.style.top = (1-v.y)/2*H+'px'; }
  requestAnimationFrame(frame);
}

function resize(){
  const W = stage.clientWidth, H = stage.clientHeight, a = W/H;
  const panelOpen = SEL && W>720;
  // na telefonie (pion) biuro wypełnia szerokość, brzegi mogą lekko uciec
  const h = a<1 ? Math.max(3.2, 5.2/a) : Math.max(3.9, 6.6/a);
  cam.left=-h*a; cam.right=h*a; cam.top=h; cam.bottom=-h;
  // otwarty panel: biuro przesuwa się w lewo, żeby nic nie chować
  if (panelOpen) cam.setViewOffset(W, H, 190, 0, W, H); else cam.clearViewOffset();
  cam.updateProjectionMatrix();
  renderer.setSize(W,H,false);
}
addEventListener('resize', resize);

// klik w postać, biurko, robota albo Lawę
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const tip = document.getElementById('tip');
function hit(e){
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mouse, cam);
  for (const h of ray.intersectObjects(pickables,false)){
    const u = h.object.userData;
    if (u.dog) return { dog:true };
    if (u.person) return { id:u.person };
    if (u.station!==undefined){ const o = STATIONS[u.station].occ; if (o) return { id:o.id, robot:o }; }
  }
  return null;
}
renderer.domElement.addEventListener('click', e=>{
  const h = hit(e);
  if (h?.dog){ DOG.jump = .5; DOG.bark = clock.elapsedTime + 1.4; return; }
  select(h?.id || null);
});
renderer.domElement.addEventListener('pointermove', e=>{
  const h = hit(e);
  renderer.domElement.style.cursor = h ? 'pointer' : '';
  let html = '';
  if (h?.dog) html = '<b>Lawa</b><span>biurowy pies</span>';
  else if (h?.robot) html = `<b>${esc(h.robot.name)}</b><span>${esc(HEALTH[h.robot.health][1])}: ${esc(h.robot.info)}</span>` + (h.robot.counter ? `<span>${esc(h.robot.counter.value)} ${esc(h.robot.counter.label)}</span>` : '');
  else if (h?.id && people[h.id]) { const s = personState(h.id); html = `<b>${esc(PEOPLE[h.id].name)}</b><span>${s.label}</span>`; }
  tip.innerHTML = html; tip.style.opacity = html ? 1 : 0;
  tip.style.left = e.clientX+14+'px'; tip.style.top = e.clientY+14+'px';
});

// ================= dane z aplikacji =================
let READY = false;
async function poll(){
  try {
    const r = await fetch(`${API}/api/presence/state`, { headers:{ Authorization:`Bearer ${localStorage.getItem('token')||''}` } });
    if (r.status===401) throw new Error('zaloguj się ponownie');
    if (!r.ok) throw new Error(`błąd serwera ${r.status}`);
    const d = await r.json();
    await syncPeople(d.people);
    STATE.sessions = d.sessions.map(fromServer);
    STATE.live = true; STATE.error = '';
  } catch (e) {
    STATE.live = false; STATE.error = e.message.includes('zaloguj') || e.message.startsWith('błąd') ? e.message : 'brak połączenia';
  }
  if (READY) render();
}
setInterval(poll, 5000);

// ================= start =================
await buildRoom();
applyNight();
await poll();
document.getElementById('loading').remove();
if (PEOPLE[location.hash.slice(1)]) SEL = location.hash.slice(1);
READY = true;
resize(); render(); frame();
window.__ready = true;
</script>
